  --verde: #1E8449; --verde-bg: #D1FAE5;
  --amarelo: #D4AC0D; --amarelo-bg: #FEF3C7;
  --vermelho: #C0392B; --vermelho-bg: #FEE2E2;

body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--texto); height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }

/* ── SIDEBAR ── */
.sb { width: var(--sidebar); background: var(--roxo-esc); color: white; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
.sb-logo { padding: 22px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sb-logo-tag { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.4); margin-bottom: 3px; }
.sb-logo-name { font-size: 15px; font-weight: 700; }
.sb-logo-sub { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }
.sb-partner { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sb-p-row { display: flex; align-items: center; gap: 10px; }
.sb-avatar { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: white; flex-shrink: 0; }
.sb-p-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
.sb-p-banker { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 1px; }
.sb-steps { flex: 1; padding: 10px 0; }
.sb-step { display: flex; align-items: center; gap: 10px; padding: 9px 20px; cursor: pointer; border-left: 3px solid transparent; transition: background 0.15s; }
.sb-step:hover { background: rgba(255,255,255,0.05); }
.sb-step.active { background: rgba(255,255,255,0.1); border-left-color: var(--roxo-cl); }
.sb-step.done { opacity: 0.65; }
.sb-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
.sb-dot.pend { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.4); }
.sb-dot.curr { background: var(--roxo-cl); color: white; }
.sb-dot.done { background: var(--verde); color: white; }
.sb-dot.gen { background: var(--amarelo); color: white; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.5 } }
.sb-step-lbl { font-size: 12px; line-height: 1; }
.sb-step-desc { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; }
.sb-foot { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 10px; color: rgba(255,255,255,0.3); }

/* ── MAIN ── */
.main { flex: 1; overflow-y: auto; }

/* ── QUEUE ── */
.q-head { padding: 28px 32px 20px; background: white; border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 10; }
.q-head h1 { font-size: 22px; font-weight: 700; }
.q-head p { font-size: 13px; color: var(--suave); margin-top: 2px; }
.q-list { padding: 20px 32px; display: flex; flex-direction: column; gap: 10px; }
.pc { background: white; border: 1px solid var(--borda); border-radius: 12px; padding: 16px 20px; cursor: pointer; display: flex; align-items: center; gap: 16px; transition: all 0.18s; }
.pc:hover { border-color: var(--roxo-cl); box-shadow: 0 4px 16px rgba(90,41,130,0.1); transform: translateY(-1px); }
.pc-av { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: white; flex-shrink: 0; }
.pc-info { flex: 1; min-width: 0; }
.pc-name { font-size: 15px; font-weight: 600; }
.pc-banker { font-size: 12px; color: var(--suave); margin-top: 2px; }
.pc-tags { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
.chip-ativo { background: var(--roxo-bg); color: var(--roxo); }
.chip-pend { background: var(--amarelo-bg); color: #92400E; }
.chip-prog { background: var(--roxo-bg); color: var(--roxo); }
.chip-ok { background: var(--verde-bg); color: #065F46; }
.pc-arr { color: var(--borda); font-size: 20px; }

/* ── STEP CONTENT ── */
.sc { padding: 28px 32px; }
.sc-head { margin-bottom: 22px; }
.sc-head h2 { font-size: 20px; font-weight: 700; }
.sc-head p { font-size: 13px; color: var(--suave); margin-top: 3px; }
.card { background: white; border: 1px solid var(--borda); border-radius: 12px; padding: 22px; margin-bottom: 14px; }
.card-title { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.dg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.di-lbl { font-size: 10px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.di-val { font-size: 13px; font-weight: 500; }
.swatch { display: inline-flex; align-items: center; gap: 7px; }
.swatch-dot { width: 18px; height: 18px; border-radius: 4px; display: inline-block; border: 1px solid rgba(0,0,0,0.1); }

/* ── BUTTONS ── */
.btn { padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; transition: all 0.15s; text-decoration: none; }
.btn-p { background: var(--roxo); color: white; } .btn-p:hover { background: var(--roxo-esc); }
.btn-s { background: var(--bg); color: var(--texto); border: 1px solid var(--borda); } .btn-s:hover { background: var(--borda); }
.btn-g { background: var(--verde); color: white; } .btn-g:hover { background: #17743e; }
.btn-r { background: var(--vermelho-bg); color: var(--vermelho); border: 1px solid #FECACA; } .btn-r:hover { background: #FEE2E2; }
.btn-lg { padding: 12px 28px; font-size: 14px; }
.btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

/* ── PROGRESS ── */
.prog-wrap { margin: 16px 0; }
.prog-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--suave); margin-bottom: 7px; }
.prog-bar { height: 7px; background: var(--borda); border-radius: 4px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--roxo), var(--roxo-cl)); border-radius: 4px; transition: width 0.2s ease; }
.prog-msgs { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.pmsg { font-size: 12px; color: var(--suave); display: none; align-items: center; gap: 7px; }
.pmsg.active { display: flex; color: var(--roxo); font-weight: 500; }
.pmsg.done { display: flex; color: var(--verde); }

/* ── LOGO PREVIEW ── */

.logo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.logo-panel { border-radius: 10px; padding: 20px; display: flex; align-items: center; justify-content: center; }
.logo-panel-lbl { font-size: 10px; color: #999; text-align: center; margin-bottom: 8px; }

/* ── BUSINESS CARD ── */
.biz { width: 300px; height: 168px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 18px 20px; color: white; box-shadow: 0 6px 24px rgba(0,0,0,0.18); }

/* ── SITE PREVIEW ── */

.site-bar { background: #E5E5E5; padding: 7px 12px; display: flex; gap: 5px; align-items: center; }
.site-dot { width: 9px; height: 9px; border-radius: 50%; }
.site-url-box { background: white; border-radius: 4px; padding: 1px 10px; font-size: 10px; color: #666; flex: 1; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.site-hero { padding: 28px 24px; color: white; text-align: center; }
.site-hero h1 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
.site-hero p { font-size: 11px; opacity: 0.85; margin-bottom: 14px; line-height: 1.5; }
.site-cta-btn { display: inline-block; background: white; border-radius: 6px; padding: 7px 18px; font-size: 11px; font-weight: 700; text-decoration: none; }
.site-specs { padding: 12px 24px; background: white; display: flex; flex-wrap: wrap; gap: 5px; }
.site-spec { font-size: 10px; padding: 3px 9px; background: var(--roxo-bg); border-radius: 20px; color: var(--roxo); font-weight: 500; }
.site-disc { padding: 8px 24px; background: #f9f9f9; font-size: 9px; color: #888; line-height: 1.6; }

/* ── PUBLISH STEPS ── */

.pub-step:last-child { border-bottom: none; }
.pub-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.pub-lbl { font-size: 13px; font-weight: 500; }
.pub-det { font-size: 11px; color: var(--suave); margin-top: 1px; }

.st-pend { color: #9CA3AF; }
.st-run { color: var(--roxo); animation: pulse 1s infinite; }
.st-ok { color: var(--verde); }

/* ── ENTREGA ── */
.entrega-block { border: 1px solid var(--borda); border-radius: 8px; padding: 14px; margin-bottom: 10px; }

function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

const S = {
  view: 'queue',
  pid: null,
  si: 0,
  status:      lsGet('awt_status', {}),
  pubSt: null,
  ajustesNote: lsGet('awt_ajustes', {}),
  ajustesImg:  {},
  iter:        lsGet('awt_iter', {}),
  apiKey:      (()=>{ try { return localStorage.getItem('awt_apikey') || ''; } catch(e){ return ''; } })(),
  githubToken: (()=>{ try { return localStorage.getItem('awt_githubtoken') || ''; } catch(e){ return ''; } })(),
  vercelToken: (()=>{ try { return localStorage.getItem('awt_verceltoken') || ''; } catch(e){ return ''; } })(),
  openaiKey:   (()=>{ try { return localStorage.getItem('awt_openaikey') || ''; } catch(e){ return ''; } })(),
  results:     lsGet('awt_results', {}),
  apiConfigOpen: false,
  githubCfgOpen: false,
  vercelCfgOpen: false,
  openaiCfgOpen: false,
  fotoCorpInput: {}, // session-only: { pid: dataUrl }
};

function saveState() {
  lsSet('awt_status',  S.status);
  lsSet('awt_ajustes', S.ajustesNote);
  lsSet('awt_iter',    S.iter);
  // results pode ser grande — salva item por item para não estourar quota
  try {
    const slim = {};
    Object.keys(S.results).forEach(k => {
      const v = S.results[k];
      if (typeof v === 'string' && v.length < 300000) slim[k] = v; // ignora se muito grande
    });
    lsSet('awt_results', slim);
  } catch(e) {}
}

function gst(pid, sid) { return S.status[pid + '_' + sid] || 'pending'; }
function sst(pid, sid, v) { S.status[pid + '_' + sid] = v; lsSet('awt_status', S.status); }
function gp(id) { return PARTNERS.find(p => p.id === id); }

function resetPartner(pid) {
  const prefix = pid + '_';
  ['status','ajustesNote','iter','results'].forEach(key => {
    Object.keys(S[key]).forEach(k => { if (k.startsWith(prefix)) delete S[key][k]; });
  });
  saveState();
  render();
}

function getSteps(p) {
  return ALL_STEPS.filter(s => {
    if (s.id === 'fotoCorp')      return p.ativos.includes('fotos-ai');
    if (s.id === 'cartao')        return p.ativos.includes('papelaria');
    if (s.id === 'papelTimbrado') return p.ativos.includes('papelaria');
    return true;
  });
}

function partnerStatus(p) {
  const steps = getSteps(p);
  const done = steps.filter(s => gst(p.id, s.id) === 'done').length;
  if (done === 0) return 'pend';
  if (done === steps.length) return 'ok';
  return 'prog';
}

function initials(name) {
  const words = name.split(' ').filter(w => w.length > 2);
  return (words.slice(0, 2).map(w => w[0]).join('') || name.slice(0, 2)).toUpperCase();
}

function buildVisibilityPatch() {
  // IMPORTANTE: NÃO colocar a tag de fechamento de script literal aqui — o parser HTML termina o bloco
  const CSS = '<style id="_awt_patch">\n' +
    '*,*::before,*::after{animation:none!important;animation-name:none!important;transition:none!important}\n' +
    'html,body{background:#fff!important;min-height:100vh!important}\n' +
    'body{color:#111!important}\n' +
    '*{opacity:1!important;visibility:visible!important}\n' +
    '</style>';
  const JS = '<scri' + 'pt>(function(){\n' +
    '  var SK={SCRIPT:1,STYLE:1,HEAD:1,META:1,LINK:1,TITLE:1};\n' +
    '  function fv(){document.querySelectorAll("*").forEach(function(el){\n' +
    '    if(SK[el.tagName])return;\n' +
    '    var c=window.getComputedStyle(el);\n' +
    '    if(parseFloat(c.opacity)<0.1)el.style.setProperty("opacity","1","important");\n' +
    '    if(c.visibility==="hidden")el.style.setProperty("visibility","visible","important");\n' +
    '    if(c.display==="none")el.style.setProperty("display","block","important");\n' +
    '  });}\n' +
    '  document.addEventListener("DOMContentLoaded",fv);\n' +
    '  setTimeout(fv,100);setTimeout(fv,600);setTimeout(fv,1500);\n' +
    '})();</' + 'scri' + 'pt>';
  return CSS + JS;
}

function injectIframe(f, html) {
  if (!html || !f) return;
  const patchedHtml = html.replace(/<\/head>/i, buildVisibilityPatch() + '</head>');
  const hasBody = /<body/i.test(html);
  const hasClose = /<\/html>/i.test(html);
  console.log('[injectIframe] chars:', html.length, 'hasBody:', hasBody, 'hasClosingHtml:', hasClose);
  if (!hasBody) console.warn('[injectIframe] HTML SEM BODY — geração truncada!');
  // srcdoc funciona diretamente em file:// sem cross-origin
  f.srcdoc = patchedHtml;
}

function render() {
  document.getElementById('app').innerHTML = S.view === 'queue' ? rQueue() : rWorkflow();
  requestAnimationFrame(() => {
    document.querySelectorAll('iframe[data-srcdoc-key]').forEach(f => {
      injectIframe(f, S.results[f.dataset.srcdocKey]);
    });
  });
}

// ── WORKFLOW ──
function rWorkflow() {
  const p = gp(S.pid);
  if (!p) return rQueue();
  const steps = getSteps(p);
  const cur = steps[S.si];

  const sbSteps = steps.map((s, i) => {
    const st = gst(p.id, s.id);
    const isActive = i === S.si;
    const dotCls = isActive ? 'curr' : (st === 'done' ? 'done' : (st === 'generating' ? 'gen' : 'pend'));
    const dotTxt = st === 'done' ? '✓' : (i + 1);
    return `<div class="sb-step ${isActive ? 'active' : ''} ${st === 'done' ? 'done' : ''}" data-a="jump" data-i="${i}">
      <div class="sb-dot ${dotCls}">${dotTxt}</div>
      <div>
        <div class="sb-step-lbl">${s.label}</div>
        <div class="sb-step-desc">${s.desc}</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="app" style="min-height:100vh">
    <div class="sb">
      <div class="sb-logo">
        <button class="back-btn" data-a="back">← Fila</button>
        <div class="sb-logo-tag">AWT GROUP</div>
        <div class="sb-logo-name">Painel de Branding</div>
      </div>
      <div class="sb-partner">
        <div class="sb-p-row">
          <div class="sb-avatar" style="background:#${p.corHex}">${initials(p.nomeMarca)}</div>
          <div>
            <div class="sb-p-name">${p.nomeMarca}</div>
            <div class="sb-p-banker">${p.nomeBanker}</div>
          </div>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:9px">
          ${p.ativos.map(a => `<span style="font-size:9px;padding:2px 7px;background:rgba(255,255,255,0.1);border-radius:20px;color:rgba(255,255,255,0.65)">${a}</span>`).join('')}
        </div>
        <button data-a="reset-partner" data-id="${p.id}" style="margin-top:10px;width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer;text-align:left" title="Zerar tudo e recomeçar do zero">🗑️ Zerar tudo e recomeçar</button>
      </div>
      <div class="sb-steps">${sbSteps}</div>
      ${rApiCfg()}
    </div>
    <div class="main">${rStep(p, cur, S.si, steps)}</div>
  </div>`;
}

function rStep(p, step, si, steps) {
  const id = step.id;
  if (id === 'briefing')  return rBriefing(p, step, si, steps);
  if (id === 'logo')          return rGen(p, step, si, 'logo');
  if (id === 'cartao')        return rGen(p, step, si, 'cartao');
  if (id === 'papelTimbrado') return rGen(p, step, si, 'papelTimbrado');
  if (id === 'site')          return rGen(p, step, si, 'site');
  if (id === 'fotoCorp')  return rGen(p, step, si, 'fotoCorp');
  if (id === 'revisao')   return rRevisao(p, step, si, steps);
  if (id === 'publicar')  return rPublicar(p, step, si, steps);
  if (id === 'entregar')  return rEntregar(p, step, si, steps);
}

// ── PUBLICAR ──
const PUB_STEPS = [
  { icon: '🐙', label: 'Push no GitHub',       getDetail: s => `awt-mkt-hub/awt-mkt-hub.github.io / ${s}/index.html` },
  { icon: '📦', label: 'Arquivos commitados',  getDetail: s => `${s}/index.html + ${s}/logo.svg` },
  { icon: '▲',  label: 'Deploy no Vercel',     getDetail: s => `${s}.vercel.app` },
  { icon: '🌐', label: 'Site publicado',        getDetail: s => `https://${s}.vercel.app` },
];

function rPublicar(p, step, si, steps) {
  const pubSt = S.pubSt; // null | 0..3 | 'done'

  const rows = PUB_STEPS.map((ps, i) => {
    let iconBg = '#F4F0F8', stHtml = `<span class="pub-st st-pend">Aguardando</span>`;
    if (pubSt === 'done') {
      iconBg = '#D1FAE5'; stHtml = `<span class="pub-st st-ok">✓ Concluído</span>`;
    } else if (pubSt !== null) {
      if (i < pubSt) { iconBg = '#D1FAE5'; stHtml = `<span class="pub-st st-ok">✓ Concluído</span>`; }
      else if (i === pubSt) { iconBg = '#EDE9F5'; stHtml = `<span class="pub-st st-run">Em andamento…</span>`; }
    }
    return `<div class="pub-step">
      <div class="pub-icon" style="background:${iconBg}">${ps.icon}</div>
      <div><div class="pub-lbl">${ps.label}</div><div class="pub-det">${ps.getDetail(p.slug)}</div></div>
      ${stHtml}
    </div>`;
  }).join('');

  if (pubSt === 'error') {
    return `<div class="sc">
      <div class="sc-head"><h2>⚠️ Erro ao publicar</h2></div>
      <div class="card" style="color:#B91C1C;font-size:13px;padding:16px">${S.pubError || 'Erro desconhecido.'}</div>
      <div class="btn-row">
        <button class="btn btn-s" data-a="publish" data-pid="${p.id}">↺ Tentar novamente</button>
      </div>
    </div>`;
  }
  if (pubSt === 'done') {
    const url = S.pubUrl || `https://${p.slug}.vercel.app`;
    return `<div class="sc">
      <div class="sc-head"><h2>🚀 Publicado!</h2><p>Site no ar.</p></div>
      <div class="card">${rows}</div>
      <div class="box-ok">
        <span style="font-size:22px">🌐</span>
        <div>
          <div style="font-weight:700;color:#065F46">Site publicado com sucesso!</div>
          <div style="font-size:12px;color:#065F46;margin-top:2px">${url}</div>
        </div>
        <a href="${url}" target="_blank" class="btn btn-s" style="margin-left:auto">Abrir ↗</a>
      </div>
      <div class="btn-row" style="margin-top:20px">
        <button class="btn btn-p btn-lg" data-a="done" data-pid="${p.id}" data-sid="publicar">Continuar →</button>
      </div>
    </div>`;
  }

  return `<div class="sc">
    <div class="sc-head"><h2>🚀 Publicar</h2><p>Faz o push no GitHub e ativa o GitHub Pages para publicar o site.</p></div>
    <div class="card">${rows}</div>
    ${pubSt !== null ? '' : `<div class="btn-row"><button class="btn btn-p btn-lg" data-a="publish" data-pid="${p.id}">🚀 Publicar agora</button></div>`}
  </div>`;
}

// EVENTS
// ═══════════════════════════════════════════════
document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;

  if (a === 'reset-partner') {
    const pid = parseInt(el.dataset.id);
    const p = gp(pid);
    if (confirm(`Zerar TUDO da ${p ? p.nomeMarca : 'parceira'}?\n\nLogo, site, cartão e papel timbrado gerados serão apagados e os passos voltarão para "Pendente".\n\nEssa ação não pode ser desfeita.`)) {
      resetPartner(pid);
      S.view = 'queue';
      render(); scrollTop();
    }
    return;
  }
  if (a === 'sel') {
    S.view = 'workflow'; S.pid = parseInt(el.dataset.id); S.si = 0; S.pubSt = null;
    sst(S.pid, 'briefing', 'done');
    S.si = 0;
    render(); scrollTop();
  }
  if (a === 'back') { S.view = 'queue'; render(); scrollTop(); }
  if (a === 'qtab') { S.qTab = el.dataset.tab; render(); scrollTop(); }
  if (a === 'jump') {
    S.si = parseInt(el.dataset.i); render(); scrollTop();
  }
  if (a === 'done') {
    const pid = parseInt(el.dataset.pid), sid = el.dataset.sid;
    // Ao aprovar o logo, trava o SVG para usar nas etapas seguintes
    if (sid === 'logo') {
      S.logoApproved = S.logoApproved || {};
      S.logoApproved[pid] = true;
    }
    sst(pid, sid, 'done');
    const steps = getSteps(gp(pid));
    const ci = steps.findIndex(s => s.id === sid);
    if (ci < steps.length - 1) {
      S.si = ci + 1;
      render(); scrollTop();
    } else {
      // Último passo — vai para aba de concluídos com banner de sucesso
      S.view = 'queue';
      S.qTab = 'concluidos';
      S._successPid = pid;
      render(); scrollTop();
      setTimeout(() => { delete S._successPid; render(); }, 4000);
    }
  }
  if (a === 'gen') {
    const pid = parseInt(el.dataset.pid), sid = el.dataset.sid, type = el.dataset.type;
    sst(pid, sid, 'generating');
    render();
    animateGen(pid, sid, type);
  }
  if (a === 'show-ajustes') {
    sst(parseInt(el.dataset.pid), el.dataset.sid, 'ajustes');
    render(); scrollTop();
  }
  if (a === 'cancel-ajustes') {
    sst(parseInt(el.dataset.pid), el.dataset.sid, 'done');
    render(); scrollTop();
  }
  if (a === 'confirm-ajustes') {
    const pid = parseInt(el.dataset.pid), sid = el.dataset.sid, type = el.dataset.type;
    const txt = document.getElementById('ajustes-txt');
    const note = txt ? txt.value.trim() : '';
    if (!S.ajustesNote) S.ajustesNote = {};
    if (note) S.ajustesNote[pid + '_' + sid] = note;
    // avança variante visual
    const k = pid + '_' + sid;
    S.iter[k] = (S.iter[k] || 0) + 1;
    sst(pid, sid, 'generating');
    render();
    // busca URLs do ajuste antes de gerar
    fetchUrlsFromNote(note).then(enriched => {
      if (enriched !== note) S.ajustesNote[pid + '_' + sid] = enriched;
      animateGen(pid, sid, type);
    });
  }
  if (a === 'publish') {
    S.pubSt = 0; S.pubError = null; S.pubUrl = null; render();
    animatePublish(parseInt(el.dataset.pid));
  }
  if (a === 'toggle-apicfg') {
    S.apiConfigOpen = !S.apiConfigOpen; render();
    if (S.apiConfigOpen) setTimeout(() => { const i = document.getElementById('api-key-input'); if(i) i.focus(); }, 50);
  }
  if (a === 'close-apicfg') { S.apiConfigOpen = false; render(); }
  if (a === 'save-apikey') {
    const inp = document.getElementById('api-key-input');
    if (inp) {
      // Remove qualquer caractere não-ASCII que possa ter entrado ao colar
      S.apiKey = inp.value.replace(/[^\x20-\x7E]/g, '').trim();
      try { if (S.apiKey) localStorage.setItem('awt_apikey', S.apiKey); else localStorage.removeItem('awt_apikey'); } catch(e){}
      S.apiConfigOpen = false;
      render();
    }
  }
  if (a === 'toggle-vercelcfg') {
    S.vercelCfgOpen = !S.vercelCfgOpen; render();
    if (S.vercelCfgOpen) setTimeout(() => { const i = document.getElementById('vercel-token-input'); if(i) i.focus(); }, 50);
  }
  if (a === 'close-vercelcfg') { S.vercelCfgOpen = false; render(); }

// ── FETCH URLs DE AJUSTE ──
// Detecta URLs no texto do ajuste, busca o HTML, extrai texto relevante e injeta como referência
async function fetchUrlsFromNote(note) {
  if (!note) return note;
  const urlRegex = /https?:\/\/[^\s"'<>]+/g;
  const urls = note.match(urlRegex);
  if (!urls || urls.length === 0) return note;

  let enriched = note;
  for (const url of urls) {
    try {
      // Usa AllOrigins como proxy CORS
      const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
      const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const json = await res.json();
      const html = json.contents || '';

      // Extrai texto limpo: remove scripts, styles, tags
      const tmp = document.createElement('div');
      tmp.innerHTML = html
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/<[^>]+>/g, ' ')
        .replace(/\s+/g, ' ');
      let textContent = tmp.textContent.trim().slice(0, 1200);

      // Extrai cores CSS mais frequentes
      const colorMatches = html.match(/#[0-9a-fA-F]{3,6}(?=[^0-9a-fA-F])/g) || [];
      const colorCounts = {};
      colorMatches.forEach(c => { colorCounts[c.toLowerCase()] = (colorCounts[c.toLowerCase()] || 0) + 1; });
      const topColors = Object.entries(colorCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([c]) => c)
        .join(', ');

      const refBlock = `\n\n[REFERÊNCIA VISUAL BUSCADA DE ${url}]\nCores predominantes: ${topColors || 'não identificadas'}\nConteúdo da página: ${textContent}\n[FIM DA REFERÊNCIA]`;
      enriched = enriched.replace(url, url + refBlock);
    } catch (e) {
      // falha silenciosa — URL permanece no texto sem referência
    }
  }
  return enriched;
}

// ── CLAUDE API ──
async function callClaude(prompt, maxTokens = 6000, imgBase64 = null, imgMime = 'image/png') {
  const content = imgBase64
    ? [
        { type: 'image', source: { type: 'base64', media_type: imgMime, data: imgBase64 } },
        { type: 'text', text: prompt }
      ]
    : prompt;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': S.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: maxTokens,
      messages: [{ role: 'user', content }]
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  const data = await resp.json();
  return data.content[0].text;
}

async function animateFotoCorp(pid, sid) {
  const p = S.parceiros.find(x => x.id === pid);

function handleLogoFileUpload(input, pid, sid) {
  const file = input.files[0];
  if (!file) return;
  const isSvg = file.type === 'image/svg+xml' || file.name.toLowerCase().endsWith('.svg');
  const reader = new FileReader();
  reader.onload = e => {
    let svgContent;
    if (isSvg) {
      svgContent = e.target.result;
    } else {
      const data = e.target.result;
      const comma = data.indexOf(',');
      const b64 = data.substring(comma + 1);
      const mime = file.type || 'image/png';
      svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200"><image href="data:${mime};base64,${b64}" width="400" height="200" preserveAspectRatio="xMidYMid meet"/></svg>`;
    }
    const rKey = pid + '_' + sid;
    S.results[rKey] = svgContent;
    lsSet('awt_results', S.results);
    S.logoApproved = S.logoApproved || {};
    S.logoApproved[pid] = true;
    sst(pid, sid, 'done');
    render();
  };
  if (isSvg) reader.readAsText(file);
  else reader.readAsDataURL(file);
}

      if (msgIdx > lastMsg) {
        for (let i = 0; i < total; i++) {

          if (!el) continue;
          if (i < msgIdx) { el.className = 'pmsg done'; el.innerHTML = '✓ ' + el.innerHTML.replace(/^[⟳✓] /, ''); }
          else if (i === msgIdx) { el.className = 'pmsg active'; el.innerHTML = '⟳ ' + el.innerHTML.replace(/^[⟳✓] /, ''); }
        }
        lastMsg = msgIdx;
      }
      if (pct >= 100) {

      }

// ── ANIMATE PUBLISH (real GitHub + Vercel) ──
async function animatePublish(pid) {
  const p = PARTNERS.find(x => x.id === pid);
  if (!p) return;

  const ghToken  = S.githubToken;
  const vcToken  = S.vercelToken;
  const siteHtml = S.results[p.id + '_site'] || '';
  const logoSvg  = S.results[p.id + '_logo']  || '';
  const slug     = p.slug || p.nomeBanker.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  const ghOwner  = 'awt-mkt-hub';
  const ghRepo   = 'awt-mkt-hub.github.io';
  const vercelProject = `awt-${slug}`;

  const setStep = s => { S.pubSt = s; render(); };
  const fail = msg => { S.pubSt = 'error'; S.pubError = msg; render(); };

  // ── STEP 0: push index.html no GitHub ──
  setStep(0);
  if (!ghToken) { fail('Token do GitHub não configurado.'); return; }
  if (!siteHtml) { fail('Site ainda não foi gerado. Volte à etapa Site e gere o site primeiro.'); return; }

  try {
    const path  = `${slug}/index.html`;
    const apiUrl = `https://api.github.com/repos/${ghOwner}/${ghRepo}/contents/${path}`;
    // verifica se já existe (pra pegar o sha e fazer update)
    let sha = null;
    const existing = await fetch(apiUrl, {
      headers: { Authorization: `Bearer ${ghToken}`, Accept: 'application/vnd.github+json' }
    });
    if (existing.ok) { const j = await existing.json(); sha = j.sha; }

    const content = btoa(unescape(encodeURIComponent(siteHtml)));
    const body = { message: `chore: publica site ${slug}`, content };
    if (sha) body.sha = sha;

    const pushRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${ghToken}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!pushRes.ok) { const e = await pushRes.json(); fail(`GitHub: ${e.message}`); return; }
  } catch(e) { fail(`GitHub error: ${e.message}`); return; }

  // push logo.svg se existir
  if (logoSvg) {
    try {
      const logoPath = `${slug}/logo.svg`;
      const logoApi  = `https://api.github.com/repos/${ghOwner}/${ghRepo}/contents/${logoPath}`;
      let   logoSha  = null;
      const ex = await fetch(logoApi, { headers: { Authorization: `Bearer ${ghToken}`, Accept: 'application/vnd.github+json' } });
      if (ex.ok) { const j = await ex.json(); logoSha = j.sha; }
      const lBody = { message: `chore: logo ${slug}`, content: btoa(unescape(encodeURIComponent(logoSvg))) };
      if (logoSha) lBody.sha = logoSha;
      await fetch(logoApi, { method: 'PUT', headers: { Authorization: `Bearer ${ghToken}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(lBody) });
    } catch(_) {}
  }

  setStep(1); // commit feito

  // ── STEP 2: deploy no Vercel ──
  setStep(2);
  let vercelUrl = null;
  if (vcToken) {
    try {
      const toB64 = s => btoa(unescape(encodeURIComponent(s)));
      const deployFiles = [
        { file: 'index.html', data: toB64(siteHtml), encoding: 'base64' }
      ];
      if (logoSvg) deployFiles.push({ file: 'logo.svg', data: toB64(logoSvg), encoding: 'base64' });

      const deployRes = await fetch('https://api.vercel.com/v13/deployments', {
        method: 'POST',
        headers: { Authorization: `Bearer ${vcToken}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: slug,
          target: 'production',
          files: deployFiles,
          projectSettings: { framework: null }
        })
      });

      const d = await deployRes.json();
      if (!deployRes.ok) {
        console.warn('[Vercel] Deploy error:', d.error?.message || JSON.stringify(d));
        // não fatal — cai no fallback GitHub Pages
      } else {
        // Usa sempre o alias de produção (slug.vercel.app), não d.url que é deployment-specific
        vercelUrl = `https://${slug}.vercel.app`;
        // aguarda deploy propagar (Vercel é rápido, ~5-10s)
        await new Promise(r => setTimeout(r, 5000));
        console.log('[Vercel] Deploy OK:', vercelUrl, '| deployment url:', d.url);
      }
    } catch(e) {
      console.warn('[Vercel] Error:', e.message);
    }
  } else {
    console.warn('[Vercel] Token não configurado — pulando deploy Vercel');
    await new Promise(r => setTimeout(r, 600));
  }

  // ── STEP 3: URL final ──
  setStep(3);
  await new Promise(r => setTimeout(r, 600));

  S.pubSt = 'done';
  S.pubUrl = vercelUrl || `https://${ghOwner}.github.io/${slug}/`;
  render();
}

function openDetail(type, key) {
  const modal = document.getElementById('detail-modal');
  const body = document.getElementById('modal-body');
  const hd = document.getElementById('modal-title');
  const ft = document.getElementById('modal-footer');
  if (!modal || !body) return;

  const labels = { logo: '🎨 Logo', cartao: '🪪 Cartão de Visitas', papelTimbrado: '📄 Papel Timbrado', site: '🌐 Site' };
  hd.textContent = labels[type] || type;

  if (type === 'logo') {
    const svg = S.results[key];
    body.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div>
          <div style="font-size:11px;color:#999;margin-bottom:8px;text-align:center">VERSÃO PADRÃO</div>
          <div style="background:#F4F0F8;border-radius:12px;padding:40px;display:flex;align-items:center;justify-content:center;min-height:180px">${svg}</div>
        </div>
        <div>
          <div style="font-size:11px;color:#999;margin-bottom:8px;text-align:center">VERSÃO CLARA (fundo escuro)</div>
          <div style="background:#1A1A2E;border-radius:12px;padding:40px;display:flex;align-items:center;justify-content:center;min-height:180px">${svg}</div>
        </div>
      </div>`;
    ft.innerHTML = `<button class="btn btn-s" onclick="downloadSvg('${key}')">⬇ Baixar SVG</button><button class="btn btn-s" onclick="closeDetail()">Fechar</button>`;
  } else if (type === 'cartao' || type === 'papelTimbrado') {
    const html = S.results[key];
    const fid = 'modal-pap-frame';
    body.innerHTML = `<iframe id="${fid}" style="width:100%;height:70vh;border:none;border-radius:8px"></iframe>`;
    requestAnimationFrame(() => injectIframe(document.getElementById(fid), html));
    ft.innerHTML = `<button class="btn btn-s" onclick="closeDetail()">Fechar</button>`;
  } else if (type === 'site') {
    const html = S.results[key];
    const fid = 'modal-site-frame';
    body.innerHTML = `<iframe id="${fid}" style="width:100%;height:72vh;border:none;border-radius:8px"></iframe>`;
    requestAnimationFrame(() => injectIframe(document.getElementById(fid), html));
    ft.innerHTML = `<button class="btn btn-p" onclick="openSiteNewTab('${key}')">↗ Baixar / Abrir</button><button class="btn btn-s" onclick="closeDetail()">Fechar</button>`;
  }

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  const modal = document.getElementById('detail-modal');
  if (modal) modal.classList.remove('open');
  document.body.style.overflow = '';
}

function showHtmlSource(key) {
  const html = S.results[key];
  if (!html) { alert('Sem HTML gerado para ' + key); return; }
  const modal = document.getElementById('detail-modal');
  const body = document.getElementById('modal-body');
  const hd = document.getElementById('modal-title');
  const ft = document.getElementById('modal-footer');
  if (!modal || !body) return;
  const hasBody = /<body/i.test(html);
  const hasClose = /<\/html>/i.test(html);
  hd.textContent = '🔍 HTML (' + html.length + ' chars) | body: ' + (hasBody ? '✅' : '❌') + ' | </html>: ' + (hasClose ? '✅' : '❌');
  const escaped = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tailEsc = html.slice(-1200).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  body.innerHTML = `
    <div style="font-size:11px;color:#666;margin-bottom:4px">▲ INÍCIO</div>
    <textarea style="width:100%;height:30vh;font-family:monospace;font-size:11px;border:1px solid #ddd;border-radius:4px;padding:10px;resize:none" readonly>${escaped.slice(0, 2000)}</textarea>
    <div style="font-size:11px;color:#666;margin:8px 0 4px">▼ FIM (últimos 1200 chars)</div>
    <textarea style="width:100%;height:30vh;font-family:monospace;font-size:11px;border:1px solid #ddd;border-radius:4px;padding:10px;resize:none" readonly>${tailEsc}</textarea>`;
  ft.innerHTML = `<button class="btn btn-p" onclick="navigator.clipboard.writeText(S.results['${key}']).then(()=>alert('Copiado!'))">📋 Copiar tudo</button><button class="btn btn-s" onclick="closeDetail()">Fechar</button>`;
  modal.style.display = 'flex';
}

function openSiteNewTab(key) {
  const html = S.results[key];
  if (!html) return;
  // Aplica o mesmo patch de visibilidade do injectIframe
  const patched = html.replace(/<\/head>/i, buildVisibilityPatch() + '</head>');
  try {
    const blob = new Blob([patched], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (key || 'site') + '-preview.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(e) {
    const a = document.createElement('a');
    a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(patched);
    a.download = (key || 'site') + '-preview.html';
    a.click();
  }
}

function downloadSvg(key) {
  const svg = S.results[key];
  if (!svg) return;
  const b = new Blob([svg], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = key + '.svg';
  a.click();
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
render();
</script>

    <div class="modal-hd">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-ft" id="modal-footer"></div>
  </div>
</div>
