<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" style="background:transparent">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1B3D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: perfectly symmetric diamond with inner structure -->
  <g transform="translate(45,45)">
    <!-- Outer diamond -->
    <polygon points="0,-32 27.7,0 0,32 -27.7,0" fill="none" stroke="#0F1B3D" stroke-width="2.8"/>
    <!-- Inner diamond -->
    <polygon points="0,-18 15.6,0 0,18 -15.6,0" fill="#0F1B3D"/>
    <!-- Top triangle accent -->
    <polygon points="0,-32 27.7,0 0,-18 -27.7,0" fill="url(#grad1)" opacity="0.18"/>
    <!-- Center cross lines for symmetry -->
    <line x1="-27.7" y1="0" x2="-15.6" y2="0" stroke="#0F1B3D" stroke-width="2.8"/>
    <line x1="15.6" y1="0" x2="27.7" y2="0" stroke="#0F1B3D" stroke-width="2.8"/>
    <line x1="0" y1="-32" x2="0" y2="-18" stroke="#0F1B3D" stroke-width="2.8"/>
    <line x1="0" y1="18" x2="0" y2="32" stroke="#0F1B3D" stroke-width="2.8"/>
  </g>

  <!-- Vertical divider -->
  <line x1="92" y1="18" x2="92" y2="72" stroke="#0F1B3D" stroke-width="1.2" opacity="0.35"/>

  <!-- LL text -->
  <text
    x="108"
    y="58"
    font-family="'Montserrat', 'Arial', sans-serif"
    font-weight="700"
    font-size="46"
    fill="#0F1B3D"
    letter-spacing="4"
    dominant-baseline="auto">LL</text>

  <!-- Wealth text — perfectly centered below LL -->
  <text
    x="174"
    y="76"
    font-family="'Montserrat', 'Arial', sans-serif"
    font-weight="400"
    font-size="13"
    fill="#0F1B3D"
    letter-spacing="6"
    text-anchor="middle"
    dominant-baseline="auto">WEALTH</text>
</svg>